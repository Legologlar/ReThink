<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReThink | Geleceği Geri Dönüştür</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Re<span>Think</span></div>
        
        <div class="dropdown">
            <a href="#" onclick="navigateTo('account')">Hesap Ayarları</a>
            <a href="#">Dashboard (İstatistikler)</a>
            <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px 0;">
            <a href="#" onclick="logout()" style="color: #e74c3c;">Çıkış Yap</a>
        </div>
        
        <div class="auth-section">
            <div id="buttonDiv"></div>

            <div id="user-profile" class="user-profile hidden">
                <span id="user-name">Yükleniyor...</span>
                <img id="user-avatar" src="" alt="Profil">
                <div class="dropdown">
                    <a href="#">Hesap Ayarları</a>
                    <a href="#">Dashboard (İstatistikler)</a>
                    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px 0;">
                    <a href="#" onclick="logout()" style="color: #e74c3c;">Çıkış Yap</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="hero">
        <h1>Dünyayı <br><span>Yeniden Düşün.</span></h1>
        <p>Geri dönüşüm bilincini artırmak ve sürdürülebilir bir gelecek inşa etmek için buradayız.</p>
        <button class="cta-btn">Keşfetmeye Başla</button>
    </main>

    <div id="account-view" style="display: none; padding-top: 100px; min-height: 100vh; flex-direction: column; align-items: center;">
    <div class="account-card" style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 90%; max-width: 500px; text-align: center;">
        <h2 style="color: var(--text-dark); margin-bottom: 20px;">Hesap Bilgileri</h2>
        
        <div style="margin-bottom: 25px;">
            <img id="info-avatar" src="" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary-green); object-fit: cover;">
        </div>

        <div style="text-align: left; margin-bottom: 30px; padding: 0 20px;">
            <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">Ad Soyad</p>
            <p id="info-name" style="font-weight: 600; font-size: 1.1rem; margin-bottom: 15px; color: var(--text-dark); border-bottom: 1px solid #eee; padding-bottom: 5px;"></p>
            
            <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;">E-posta Adresi</p>
            <p id="info-email" style="font-weight: 600; font-size: 1.1rem; color: var(--text-dark); border-bottom: 1px solid #eee; padding-bottom: 5px;"></p>
        </div>

        <button onclick="navigateTo('home')" class="cta-btn" style="padding: 12px 30px; font-size: 0.9rem; background: var(--text-dark);">Ana Sayfaya Dön</button>
    </div>
</div>

    <script>
        function handleCredentialResponse(response) {
            console.log("Token alındı, doğrulanıyor...");

            fetch('https://rethink-lhse.onrender.com/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if(data.user) {
                    updateUI(data.user);
                }
            })
            .catch(err => console.error("Backend Hatası:", err));
        }

        function updateUI(user) {
            document.getElementById("buttonDiv").classList.add("hidden");
            document.getElementById("user-profile").classList.remove("hidden");
            
            document.getElementById("user-name").innerText = user.name;
            
            const avatarImg = document.getElementById("user-avatar");
            avatarImg.src = user.picture || `https://ui-avatars.com/api/?name=${user.name}&background=2ecc71&color=fff`;
        }

        function logout() {
            window.location.reload();
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "893805639538-gu30br0e9vvbgbfvk5g0vv35pe3t1tu9.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { 
                    theme: "filled_blue", 
                    size: "large", 
                    shape: "pill",
                    text: "continue_with"
                } 
            );
        }
        function navigateTo(endpoint) {
            const hero = document.querySelector('.hero');
            const accountView = document.getElementById('account-view');

            if (endpoint === 'account') {
                hero.style.display = 'none'; // Ana sayfayı kapat
                accountView.style.display = 'flex'; // Hesap sayfasını aç
            }
            else {
            accountView.style.display = 'none';
            hero.style.display = 'flex';
    }
}

// updateUI fonksiyonunu da bilgileri basacak şekilde güncelle
    function updateUI(user) {
        document.getElementById("buttonDiv").classList.add("hidden");
        document.getElementById("user-profile").classList.remove("hidden");
        document.getElementById("user-name").innerText = user.name;
    
        const avatarImg = document.getElementById("user-avatar");
        const infoAvatar = document.getElementById("info-avatar");
        const userImg = user.picture || `https://ui-avatars.com/api/?name=${user.name}&background=2ecc71&color=fff`;
    
        avatarImg.src = userImg;
        if(infoAvatar) infoAvatar.src = userImg;

    // Bilgileri "endpoint" içeriğine yaz
        document.getElementById("info-name").innerText = user.name;
        document.getElementById("info-email").innerText = user.email;
}
    </script>
</body>
</html>
