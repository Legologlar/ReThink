<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ReThink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Re<span>Think</span></div>
        <div class="auth-section">
            <a href="../index.html" class="cta-btn" style="padding: 8px 20px; font-size: 0.8rem; background: transparent; color: var(--text-dark); border: 1px solid #ddd;">Ana Sayfa</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="points-banner">
            <p>Mevcut Bakiyeniz</p>
            <h1 id="user-total-points">0</h1>
            <p>Re-Puan</p>
        </div>

        <div class="leaderboard-section">
            <h2>🏆 En Çevreci Rethinkçiler</h2>
            <table class="leaderboard-table">
                <tbody id="leaderboard-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
window.onload = async function() {

    const savedData = localStorage.getItem('user_data');

    if (!savedData) {
        window.location.href = 'index.html';
        return;
    }

    const user = JSON.parse(savedData);

    // ✅ KENDİ PUANINI GÖSTER
    document.getElementById('user-total-points').innerText =
        (user.points || 0).toLocaleString();

    const tbody = document.getElementById('leaderboard-body');

    try {
        // ✅ BACKEND'DEN TÜM USERLARI ÇEK
        const res = await fetch("https://rethink-lhse.onrender.com/leaderboard?limit=10");
        const users = await res.json();

        tbody.innerHTML = "";

        users.forEach((u, index) => {

            const isMe = u.name === user.name;

            tbody.innerHTML += `
                <tr class="${isMe ? 'user-row-highlight' : ''}">
                    <td class="rank">#${index + 1}</td>
                    <td class="user-info">
                        <img src="${u.picture || 'https://ui-avatars.com/api/?name=' + u.name}">
                        <span>${u.name} ${isMe ? '(Siz)' : ''}</span>
                    </td>
                    <td class="points-cell">${u.points} Puan</td>
                </tr>
            `;
        });

    } catch (err) {
        console.error("Leaderboard alınamadı:", err);
    }
}
</script>
</html>
