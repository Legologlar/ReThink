<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:flex-row">

        <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent"></div>

        <div class="absolute bottom-margin-desktop left-margin-desktop right-margin-desktop">
            <h2 class="font-headline-lg text-headline-lg text-surface-container-lowest max-w-sm">
                ReThink doğayı korumak için çalışan bir platformdur.
            </h2>
        </div>
    </div>

    <div class="w-full md:w-1/2 flex flex-col justify-center px-margin-mobile py-xl md:px-margin-desktop bg-surface relative min-h-screen">

        <div class="w-full max-w-[440px] mx-auto mt-20 md:mt-0">

            <div class="mb-xl">
                <h1 class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-xl md:text-headline-xl text-on-surface mb-sm">
                    Hesap Oluştur
                </h1>

                <p class="font-body-md text-body-md text-on-surface-variant">
                    Daha temiz bir gelecek için ilk adımı atın.
                </p>
            </div>

            <form id="registerForm" onsubmit="handleKlasikKayit(event)" class="flex flex-col gap-lg">

                <div class="flex flex-col gap-xs">
                    <label for="fullName" class="font-label-sm text-label-sm text-on-surface-variant">Ad Soyad</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
                            <span class="material-symbols-outlined text-[20px]">person</span>
                        </span>
                        <input id="fullName" name="fullName" type="text" required placeholder="Örn: Doğa Yılmaz" class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 placeholder:text-outline-variant" />
                    </div>
                </div>

                <div class="flex flex-col gap-xs">
                    <label for="email" class="font-label-sm text-label-sm text-on-surface-variant">E-posta Adresi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline">
                            <span class="material-symbols-outlined text-[20px]">mail</span>
                        </span>
                        <input id="email" name="email" type="email" required placeholder="ornek@eposta.com" class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 placeholder:text-outline-variant" />

                        </span>
                        <input id="password" name="password" type="password" required placeholder="••••••••" class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 placeholder:text-outline-variant" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script src="auth.js"></script>

    <script>
        // Şifre Göster / Gizle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }

        // --- Klasik Form ile Kayıt ---
        async function handleKlasikKayit(event) {
            event.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await fetch('https://rethink-lhse.onrender.com/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.message || "Kayıt işlemi başarısız.");

                if (typeof saveSession === 'function') {
                    saveSession(data.token, data.user);
                } else {
                    localStorage.setItem('rethink_token', data.token);
                    localStorage.setItem('rethink_user', JSON.stringify(data.user));
                }

                window.location.href = 'dashboard.html';

            } catch (err) {
                alert(err.message || "Kayıt sırasında bir hata oluştu.");
            }
        }

        // --- 🌐 Google Resmi Buton Motoru Çağrısı ---
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "BURAYA_GOOGLE_CONSOLE_CLIENT_ID_YAZILACAK", 
                callback: handleGoogleRegisterResponse
            });

            // Butonu div içerisine enjekte ediyoruz
            google.accounts.id.renderButton(
                document.getElementById("registerGoogleBtnDiv"),
                { theme: "outline", size: "large", width: "440", text: "signup_with" } 
            );
        };

        // Google penceresinden dönen şifreli JWT tokenını yakalayan fonksiyon
        function handleGoogleRegisterResponse(response) {
            console.log("Google JWT Token alındı, Render backend'e yollanıyor...");

            fetch('https://rethink-lhse.onrender.com/auth/google-register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential }) // Google'dan gelen token
            })
            .then(res => {
                if (!res.ok) throw new Error("Google kaydı backend tarafından onaylanmadı.");
                return res.json();
            })
            .then(data => {
                if (data.token && data.user) {
                    if (typeof saveSession === 'function') {
                        saveSession(data.token, data.user);
                    } else {
                        localStorage.setItem('rethink_token', data.token);
                        localStorage.setItem('rethink_user', JSON.stringify(data.user));
                    }
                    window.location.href = 'dashboard.html';
                }
            })
            .catch(err => {
                console.error("Google Kayıt Hatası:", err);
                alert(err.message);
            });
        }

        function handleMicrosoftRegister() {
            alert("Microsoft ile kayıt altyapısı şu anda yapım aşamasındadır.");
        }
    </script>
