<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReThink | Geleceği Yeniden Düşün</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Re<span>Think</span></div>
        <ul class="nav-links">
            <li><a href="#">Ana Sayfa</a></li>
            <li><a href="#">Hakkımızda</a></li>
            <li><a href="#">Keşfet</a></li>
        </ul>
        
        <div class="auth-section">
            <div id="buttonDiv"></div>

            <div id="user-profile" class="user-profile hidden">
                <span id="user-name">Yükleniyor...</span>
                <div class="avatar-wrapper">
                    <img id="user-avatar" src="" alt="Profil">
                    <div class="dropdown">
                        <a href="#">Hesap Ayarları</a>
                        <a href="#">Dashboard</a>
                        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 5px 0;">
                        <a href="#" onclick="logout()">Çıkış Yap</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="hero">
        <h1>Geleceği <br><span>Yeniden Tasarla.</span></h1>
        <p>Bilginin ve stratejinin buluştuğu yeni nesil dijital deneyim.</p>
        <button class="cta-btn">Hemen Başla</button>
    </main>

    <script>
        // 1. Google'dan Token Geldiğinde Çalışan Fonksiyon
        function handleCredentialResponse(response) {
            console.log("Token alındı, doğrulanıyor...");

            fetch('https://rethink-lhse.onrender.com/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if(data.user) {
                    // Backend'den kullanıcı gelirse arayüzü güncelle
                    updateUI(data.user);
                } else {
                    console.error("Kullanıcı verisi alınamadı");
                }
            })
            .catch(err => console.error("Backend Hatası:", err));
        }

        // 2. Arayüzü Giriş Yapılmış Haline Getiren Fonksiyon
        function updateUI(user) {
            document.getElementById("buttonDiv").classList.add("hidden");
            document.getElementById("user-profile").classList.remove("hidden");
            
            document.getElementById("user-name").innerText = user.name;
            
            // Profil resmi varsa onu koy, yoksa isim baş harflerinden avatar yap
            const avatarImg = document.getElementById("user-avatar");
            avatarImg.src = user.picture || `https://ui-avatars.com/api/?name=${user.name}&background=4f46e5&color=fff`;
        }

        // 3. Çıkış Yapma Fonksiyonu
        function logout() {
            // Şimdilik sadece sayfayı yeniliyoruz, 
            // ileride session/cookie temizliği eklenebilir.
            window.location.reload();
        }

        // 4. Sayfa Yüklendiğinde Google Butonunu Hazırla
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "893805639538-gu30br0e9vvbgbfvk5g0vv35pe3t1tu9.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { 
                    theme: "outline", 
                    size: "large", 
                    shape: "pill",
                    text: "signin_with",
                    logo_alignment: "left"
                } 
            );
        }
    </script>
</body>
</html>
