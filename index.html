<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReThink | Geleceği Geri Dönüştür</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Re<span>Think</span></div>
        
        <ul class="nav-links-container">
            <li><a href="#">Ana Sayfa</a></li>
            <li><a href="#">Geri Dönüşüm Rehberi</a></li>
            <li><a href="#">Harita</a></li>
        </ul>
        
        <div class="auth-section">
            <div id="buttonDiv"></div>

            <div id="user-profile" class="user-profile hidden">
                <span id="user-name">Yükleniyor...</span>
                <img id="user-avatar" src="" alt="Profil">
                <div class="dropdown">
                    <a href="#">Hesap Ayarları</a>
                    <a href="#">Dashboard (İstatistikler)</a>
                    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px 0;">
                    <a href="#" onclick="logout()" style="color: #e74c3c;">Çıkış Yap</a>
                </div>
            </div>
        </div>
    </nav>

    <main id="home-page" class="hero">
        <h1>Dünyayı <br><span>Yeniden Düşün.</span></h1>
        <p>Geri dönüşüm bilincini artırmak ve sürdürülebilir bir gelecek inşa etmek için buradayız.</p>
        <button class="cta-btn">Keşfetmeye Başla</button>
    </main>

    <section id="account-page" class="hidden" style="padding-top: 120px; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 90%; max-width: 500px;">
            <h2 style="margin-bottom: 20px; color: var(--text-dark);">Hesap Bilgileri</h2>
            <img id="info-avatar" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary-green); margin-bottom: 15px;">
            <p style="font-weight: 600; font-size: 1.2rem;" id="info-name">Ad Soyad</p>
            <p style="color: var(--text-muted); margin-bottom: 25px;" id="info-email">eposta@adresiniz.com</p>
            <button onclick="showPage('home-page')" class="cta-btn" style="padding: 10px 25px; font-size: 0.9rem;">Ana Sayfaya Dön</button>
        </div>
    </section>

    <script>
        function handleCredentialResponse(response) {
            console.log("Token alındı, doğrulanıyor...");

            fetch('https://rethink-lhse.onrender.com/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if(data.user) {
                    updateUI(data.user);
                }
            })
            .catch(err => console.error("Backend Hatası:", err));
        }

        // Sayfa değiştirme fonksiyonu
        function showPage(pageId) {
            // Önce her şeyi gizle
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('account-page').classList.add('hidden');
            document.getElementById('account-page').style.display = 'none';

            // Seçilen sayfayı göster
            const target = document.getElementById(pageId);
            if (pageId === 'home-page') {
                target.style.display = 'flex';
            } else {
                target.classList.remove('hidden');
                target.style.display = 'flex';
            }
        }

        function updateUI(user) {
            document.getElementById("buttonDiv").classList.add("hidden");
            document.getElementById("user-profile").classList.remove("hidden");
            document.getElementById("user-name").innerText = user.name;
            
            const avatarImg = document.getElementById("user-avatar");
            const profileAvatar = document.getElementById("info-avatar");
            const src = user.picture || `https://ui-avatars.com/api/?name=${user.name}&background=2ecc71&color=fff`;
            
            avatarImg.src = src;
            if(profileAvatar) profileAvatar.src = src;

            // Bilgileri hesap sayfasına yaz
            document.getElementById("info-name").innerText = user.name;
            document.getElementById("info-email").innerText = user.email;
        }

        function logout() {
            window.location.reload();
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "893805639538-gu30br0e9vvbgbfvk5g0vv35pe3t1tu9.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { 
                    theme: "filled_blue", 
                    size: "large", 
                    shape: "pill",
                    text: "continue_with"
                } 
            );
        }
    </script>
</body>
</html>
