<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReThink | Geleceği Geri Dönüştür</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Re<span>Think</span></div>
        <ul class="nav-links-container">
            <li><a href="#" onclick="showSection('hero')">Ana Sayfa</a></li>
            <li><a href="#">Geri Dönüşüm Rehberi</a></li>
            <li><a href="#">Harita</a></li>
        </ul>
        <div class="auth-section">
            <div id="buttonDiv"></div>
            <div id="user-profile" class="user-profile hidden">
                <span id="user-name">Yükleniyor...</span>
                <img id="user-avatar" src="" alt="Profil">
                <div class="dropdown">
                    <a href="#" onclick="showSection('account')">Hesap Ayarları</a>
                    <a href="#" onclick="showSection('dashboard')">Dashboard</a>
                    <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.05); margin: 8px 0;">
                    <a href="#" onclick="logout()" style="color: #e74c3c;">Çıkış Yap</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <main id="hero" class="content-section">
            <div class="hero-content">
                <h1>Dünyayı <br><span>Yeniden Düşün.</span></h1>
                <p>Geri dönüşüm bilincini artırmak ve sürdürülebilir bir gelecek inşa etmek için buradayız.</p>
                <button class="cta-btn" onclick="showSection('dashboard')">Keşfetmeye Başla</button>
            </div>
        </main>

        <section id="dashboard" class="content-section hidden">
            <h1>Dashboard</h1>
            <div class="stats-grid">
                <div class="card"><h3>Puan</h3><p>150</p></div>
                <div class="card"><h3>Atık</h3><p>5 kg</p></div>
            </div>
        </section>

        <section id="account" class="content-section hidden">
            <h1>Hesap Bilgileri</h1>
            <div class="profile-details card">
                <p><strong>İsim:</strong> <span id="info-name"></span></p>
                <p><strong>E-posta:</strong> <span id="info-email"></span></p>
            </div>
        </section>
    </div>

    <script>
        // Sayfa Değiştirme Fonksiyonu (SPA)
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
        }

        function handleCredentialResponse(response) {
            fetch('https://rethink-lhse.onrender.com/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if(data.user) {
                    localStorage.setItem("rethink_user", JSON.stringify(data.user));
                    updateUI(data.user);
                }
            });
        }

        function updateUI(user) {
            document.getElementById("buttonDiv").classList.add("hidden");
            document.getElementById("user-profile").classList.remove("hidden");
            document.getElementById("user-name").innerText = user.name;
            document.getElementById("user-avatar").src = user.picture;
            
            // Hesap bilgilerini doldur
            document.getElementById("info-name").innerText = user.name;
            document.getElementById("info-email").innerText = user.email;

            showSection('dashboard');
        }

        function logout() {
            localStorage.removeItem("rethink_user");
            window.location.reload();
        }

        window.onload = function () {
            const savedUser = localStorage.getItem("rethink_user");
            if(savedUser) updateUI(JSON.parse(savedUser));

            google.accounts.id.initialize({
                client_id: "893805639538-gu30br0e9vvbgbfvk5g0vv35pe3t1tu9.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "filled_blue", size: "large", shape: "pill" });
        }
    </script>
</body>
</html>
