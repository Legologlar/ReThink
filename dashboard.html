<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ReThink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="auth.js"></script>

    <script src="script.js"></script>

    <script src="navbar.js"></script>

    <div class="dashboard-container">
        <div class="points-banner">
            <p>Mevcut Bakiyeniz</p>
            <h1 id="user-total-points">0</h1>
            <p>Re-Puan</p>
        </div>

        <div class="leaderboard-section">
            <h2>🏆 En Çevreci Rethinkçiler</h2>
            <table class="leaderboard-table">
                <tbody id="leaderboard-body">
                    </tbody>
            </table>
        </div>
    </div>

<script>
window.onload = async function() {

    // 1. ADIM: Önce tarayıcıda hızlıca lokal kullanıcı var mı diye bakıyoruz
    if (typeof getLocalUser !== 'function') {
        console.error("auth.js yüklenemedi veya getLocalUser fonksiyonu eksik!");
        window.location.href = 'index.html';
        return;
    }

    let user = getLocalUser();

    // Eğer lokalde hiç veri yoksa doğrudan giriş sayfasına veya ana sayfaya şutla
    if (!user) {
        console.log("Lokalde oturum bulunamadı, yönlendiriliyor...");
        window.location.href = 'index.html';
        return;
    }

    // ✅ KENDİ PUANINI LOKALDEN HIZLICA EKRANA BAS (Kullanıcı bekletilmesin)
    document.getElementById('user-total-points').innerText =
        (user.points || 0).toLocaleString();

    // 2. ADIM: Arka planda backend'e gidip token/cihaz parmak izi gerçekten geçerli mi doğrula
    console.log("Oturum backend üzerinden doğrulanıyor...");
    const verifiedUser = await verifySessionWithBackend();
    
    if (!verifiedUser) {
        console.log("Oturum geçersiz veya cihaz uyuşmuyor! Güvenlik nedeniyle çıkış yapılıyor...");
        window.location.href = 'index.html';
        return;
    }

    // Eğer backend doğrulaması başarılıysa ve puan güncellendiyse ekranı tazele
    user = verifiedUser;
    document.getElementById('user-total-points').innerText =
        (user.points || 0).toLocaleString();


    // 3. ADIM: LEADERBOARD (LİDERLİK TABLOSU) VERİLERİNİ ÇEK
    const tbody = document.getElementById('leaderboard-body');

    try {
        const res = await fetch("https://rethink-lhse.onrender.com/leaderboard?limit=10");
        const users = await res.json();

        tbody.innerHTML = "";

users.forEach((u, index) => {
    // 🌟 ARTIK İSME DEĞİL, BENZERSİZ UID'YE BAKIYORUZ!
    // Eğer backend'den gelen u.uid ile o an oturum açmış user.uid eşleşiyorsa o kişi SİZSİNİZDİR.
    const isMe = u.uid === user.uid;

    tbody.innerHTML += `
        <tr class="${isMe ? 'user-row-highlight' : ''}">
            <td class="rank">#${index + 1}</td>
            <td class="user-info">
                <img src="${u.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.name || 'User')}">
                <span>${u.name || 'Gizli Kullanıcı'} ${isMe ? '(Siz)' : ''}</span>
            </td>
            <td class="points-cell">${u.points || 0} Puan</td>
        </tr>
    `;
});
        
    } catch (err) {
        console.error("Leaderboard alınamadı:", err);
    }
}
</script>
</body>
</html>
