<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ReThink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="auth.js"></script>

    <script src="script.js"></script>

    <script src="navbar.js"></script>

    <div class="dashboard-container">
        <div class="points-banner">
            <p>Mevcut Bakiyeniz</p>
            <h1 id="user-total-points">0</h1>
            <p>Re-Puan</p>
        </div>

        <div class="leaderboard-section">
            <h2>🏆 En Çevreci Rethinkçiler</h2>
            <table class="leaderboard-table">
                <tbody id="leaderboard-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
window.onload = async function() {

    // 🌟 YENİ SİSTEM KONTROLÜ: 
    // Eski localStorage.getItem("user_data") yerine auth.js içindeki fonksiyonu çağırıyoruz.
    if (typeof getLocalUser !== 'function') {
        console.error("auth.js yüklenemedi!");
        window.location.href = 'index.html';
        return;
    }

    const user = getLocalUser();

    // Eğer auth.js aktif bir kullanıcı bulamazsa, güvenle index.html'e yönlendirir
    if (!user) {
        window.location.href = 'index.html';
        return;
    }

    // ✅ KENDİ PUANINI GÖSTER
    document.getElementById('user-total-points').innerText =
        (user.points || 0).toLocaleString();

    const tbody = document.getElementById('leaderboard-body');

    try {
        // ✅ BACKEND'DEN TÜM USERLARI ÇEK
        const res = await fetch("https://rethink-lhse.onrender.com/leaderboard?limit=10");
        const users = await res.json();

        tbody.innerHTML = "";

        users.forEach((u, index) => {
            // Backend'den dönen veriye göre u.name veya u.displayName kontrolü
            const isMe = u.name === user.name || (user.uid && u.uid === user.uid);

            tbody.innerHTML += `
                <tr class="${isMe ? 'user-row-highlight' : ''}">
                    <td class="rank">#${index + 1}</td>
                    <td class="user-info">
                        <img src="${u.picture || u.photo || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.name || 'User')}">
                        <span>${u.name || 'Gizli Kullanıcı'} ${isMe ? '(Siz)' : ''}</span>
                    </td>
                    <td class="points-cell">${u.points || 0} Puan</td>
                </tr>
            `;
        });

    } catch (err) {
        console.error("Leaderboard alınamadı:", err);
    }
}
</script>
</body>
</html>
