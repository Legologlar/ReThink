<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Bilgileri | ReThink</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Re<span>Think</span></div>
    <div class="auth-section">
        <a href="index.html" class="cta-btn" style="padding: 8px 20px; font-size: 0.9rem;">Ana Sayfa</a>
    </div>
</nav>

<main class="hero" style="background: var(--light-green);">
div class="account-card">
    <h2>Profil Bilgileriniz</h2>

    <div class="avatar-wrapper">
        <img id="info-avatar">
    </div>

    <div class="info-group">
        <label>AD SOYAD</label>
        <p id="info-name">Yükleniyor...</p>
    </div>

    <div class="info-group">
        <label>E-POSTA ADRESİ</label>
        <p id="info-email">Yükleniyor...</p>
    </div>

    <div class="info-group">
        <label>PUAN</label>
        <p id="info-points">0</p>
    </div>

    <button onclick="history.back()" class="cta-btn">Geri Dön</button>
</div>
</main>

<script src="script.js"></script>

<script>
window.addEventListener("load", () => {

    let user = JSON.parse(localStorage.getItem("user_data"));

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    const nameEl = document.getElementById("info-name");
    const emailEl = document.getElementById("info-email");
    const pointsEl = document.getElementById("info-points");
    const avatarEl = document.getElementById("info-avatar");

    function render(u) {
        nameEl.innerText = u.name || "Yok";
        emailEl.innerText = u.email || "Yok";
        pointsEl.innerText = u.points ?? 0;

        avatarEl.src = u.picture || 
            `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}`;
    }

    // İlk yükleme (local)
    render(user);

    // Backend’den çek
    function fetchUser() {
        fetch(`https://rethink-lhse.onrender.com/user/${user.uid}`)
            .then(res => res.json())
            .then(data => {
                if (!data) return;

                user = data;

                localStorage.setItem("user_data", JSON.stringify(data));
                render(data);
            })
            .catch(err => console.error("Fetch hata:", err));
    }

    // İlk fetch
    fetchUser();

    // 🔁 Her 5 saniye güncelle
    setInterval(fetchUser, 5000);

});
</script>

</body>
</html>
